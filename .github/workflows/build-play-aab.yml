name: Build Wafferha Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Play project
        run: unzip -q -o Wafferha-Play-Project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WAFFERHA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/wafferha-upload-key.jks"

      - name: Build signed release AAB
        env:
          WAFFERHA_STORE_FILE: ${{ github.workspace }}/wafferha-upload-key.jks
          WAFFERHA_STORE_PASSWORD: ${{ secrets.WAFFERHA_STORE_PASSWORD }}
          WAFFERHA_KEY_ALIAS: ${{ secrets.WAFFERHA_KEY_ALIAS }}
          WAFFERHA_KEY_PASSWORD: ${{ secrets.WAFFERHA_KEY_PASSWORD }}
        run: gradle -p android bundleRelease --stacktrace

      - name: Rename AAB
        run: cp android/app/build/outputs/bundle/release/app-release.aab Wafferha.aab

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Wafferha-Play-AAB
          path: Wafferha.aab
          if-no-files-found: error
