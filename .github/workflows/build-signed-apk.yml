name: Build Wafferha Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q -o Wafferha-Android-Project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WAFFERHA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/wafferha-upload-key.jks"

      - name: Build signed release APK
        env:
          WAFFERHA_STORE_FILE: ${{ github.workspace }}/wafferha-upload-key.jks
          WAFFERHA_STORE_PASSWORD: ${{ secrets.WAFFERHA_STORE_PASSWORD }}
          WAFFERHA_KEY_ALIAS: ${{ secrets.WAFFERHA_KEY_ALIAS }}
          WAFFERHA_KEY_PASSWORD: ${{ secrets.WAFFERHA_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wafferha-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
