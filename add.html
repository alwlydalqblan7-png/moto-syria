<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة إعلان - موتو سوريا 🏍️</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.form-container {
    max-width: 600px;
    margin: 20px auto;
    padding: 15px;
}

.form-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

.form-title {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
}

.form-group textarea {
    min-height: 130px;
    resize: vertical;
}

.image-input {
    background: #f7f7f7;
    padding: 15px;
}

.preview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.preview-item {
    position: relative;
}

.preview img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #ddd;
    display: block;
}

.remove-image {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: #dc3545;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    z-index: 5;
}

.buttons {
    display: grid;
    gap: 10px;
    margin-top: 20px;
}

.save-button {
    background: #198754;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:disabled {
    opacity: 0.6;
}

.back-button {
    background: #555;
    color: white;
    text-decoration: none;
    text-align: center;
    border-radius: 10px;
    padding: 14px;
    font-weight: bold;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.7;
}

</style>

</head>

<body>

<header>

<h1>🏍️ موتو سوريا</h1>

<p id="headerText">إضافة إعلان دراجة نارية</p>

</header>


<main>

<div class="form-container">

<div class="form-card">

<h2 class="form-title" id="pageTitle">
➕ إضافة إعلان جديد
</h2>


<form id="adForm">


<div class="form-group">

<label for="name">
🏍️ اسم الدراجة
</label>

<input
type="text"
id="name"
placeholder="مثال: هوندا 125"
required
>

</div>


<div class="form-group">

<label for="price">
💰 السعر
</label>

<input
type="text"
id="price"
placeholder="مثال: 15,000,000 ل.س"
required
>

</div>


<div class="form-group">

<label for="whatsapp">
📱 رقم واتساب
</label>

<input
type="tel"
id="whatsapp"
placeholder="مثال: 9639XXXXXXXX"
>

<small>
اكتب الرقم مع مفتاح الدولة، بدون +
</small>

</div>


<div class="form-group">

<label for="info">
📋 تفاصيل الدراجة
</label>

<textarea
id="info"
placeholder="اكتب الموديل، سنة الصنع، الحالة، المكان، وأي معلومات أخرى..."
></textarea>

</div>


<div class="form-group">

<label for="images">
📸 صور الدراجة
</label>

<input
type="file"
id="images"
class="image-input"
accept="image/*"
multiple
>

<div
id="preview"
class="preview"
></div>

</div>


<div class="buttons">

<button
type="submit"
class="save-button"
id="saveButton"
>
💾 حفظ الإعلان
</button>


<a
href="index.html"
class="back-button"
>
↩️ العودة للإعلانات
</a>

</div>


<div
id="message"
class="message"
></div>


</form>

</div>

</div>

</main>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://vfqsaylyokckxobrslvb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4s_UaWxuR3Hyc0WFfk0yHQ_8oL9rHwg";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   العناصر
===================================== */

const form =
document.getElementById("adForm");

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const whatsappInput =
document.getElementById("whatsapp");

const infoInput =
document.getElementById("info");

const imagesInput =
document.getElementById("images");

const preview =
document.getElementById("preview");

const message =
document.getElementById("message");

const pageTitle =
document.getElementById("pageTitle");

const headerText =
document.getElementById("headerText");

const saveButton =
document.getElementById("saveButton");


/* =====================================
   مهم جداً
===================================== */

let selectedImages = [];


/* =====================================
   معرفة هل الصفحة إضافة أو تعديل
===================================== */

const urlParams =
new URLSearchParams(
    window.location.search
);

let editId =
urlParams.get("edit");


/* =====================================
   الرسائل
===================================== */

function setMessage(text) {

    message.textContent = text;

}


/* =====================================
   ضغط الصورة
===================================== */

function compressImage(file) {

    return new Promise(function(resolve, reject) {

        const reader =
        new FileReader();


        reader.onload = function(event) {

            const img =
            new Image();


            img.onload = function() {

                let width =
                img.width;

                let height =
                img.height;


                const maxSize = 1000;


                if (width > maxSize) {

                    height =
                    height * maxSize / width;

                    width =
                    maxSize;

                }


                if (height > maxSize) {

                    width =
                    width * maxSize / height;

                    height =
                    maxSize;

                }


                const canvas =
                document.createElement("canvas");


                canvas.width =
                Math.round(width);

                canvas.height =
                Math.round(height);


                const ctx =
                canvas.getContext("2d");


                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                canvas.toBlob(
                    function(blob) {

                        if (!blob) {

                            reject(
                                new Error(
                                    "لم يتم تحميل الصورة"
                                )
                            );

                            return;

                        }


                        resolve(blob);

                    },
                    "image/jpeg",
                    0.70
                );

            };


            img.onerror = function() {

                reject(
                    new Error(
                        "لم يتم تحميل الصورة"
                    )
                );

            };


            img.src =
            event.target.result;

        };


        reader.onerror = function() {

            reject(
                new Error(
                    "تعذر قراءة الصورة"
                )
            );

        };


        reader.readAsDataURL(file);

    });

}


/* =====================================
   عرض الصور
===================================== */

function showPreview() {

    preview.innerHTML = "";


    if (selectedImages.length === 0) {

        return;

    }


    selectedImages.forEach(
        function(item, index) {

            const box =
            document.createElement("div");

            box.className =
            "preview-item";


            const img =
            document.createElement("img");


            if (
                typeof item === "string"
            ) {

                img.src =
                item;

            } else {

                img.src =
                item.preview;

            }


            img.onload = function() {

                console.log(
                    "تم عرض الصورة رقم " +
                    (index + 1)
                );

            };


            img.onerror = function() {

                console.error(
                    "فشل عرض الصورة"
                );

            };


            const removeButton =
            document.createElement("button");


            removeButton.type =
            "button";

            removeButton.className =
            "remove-image";

            removeButton.textContent =
            "×";


            removeButton.onclick =
            function() {

                selectedImages.splice(
                    index,
                    1
                );

                showPreview();

            };


            box.appendChild(img);

            box.appendChild(
                removeButton
            );

            preview.appendChild(box);

        }
    );

}


/* =====================================
   اختيار الصور
===================================== */

imagesInput.addEventListener(
    "change",
    async function() {

        const files =
        Array.from(this.files);


        if (
            files.length === 0
        ) {

            return;

        }


        setMessage(
            "⏳ جاري تجهيز الصور..."
        );


        try {

            for (
                const file of files
            ) {

                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    continue;

                }


                const blob =
                await compressImage(file);


                const previewUrl =
                URL.createObjectURL(
                    blob
                );


                selectedImages.push({

                    blob:
                    blob,

                    preview:
                    previewUrl

                });

            }


            showPreview();


            setMessage(
                "✅ تم تجهيز " +
                selectedImages.length +
                " صورة"
            );


            this.value = "";


        } catch(error) {

            console.error(error);


            setMessage(
                "❌ حدث خطأ أثناء تجهيز الصور: " +
                error.message
            );

        }

    }
);


/* =====================================
   تحميل الإعلان عند التعديل
===================================== */

async function loadEditAd() {

    if (!editId) {

        return;

    }


    pageTitle.textContent =
    "✏️ تعديل الإعلان";

    headerText.textContent =
    "تعديل بيانات الدراجة";


    setMessage(
        "⏳ جاري تحميل الإعلان..."
    );


    try {

        const result =
        await supabaseClient
        .from("ads")
        .select(
            "id,name,price,whatsapp,info,images"
        )
        .eq(
            "id",
            editId
        )
        .maybeSingle();


        if (result.error) {

            throw result.error;

        }


        const ad =
        result.data;


        if (!ad) {

            setMessage(
                "❌ الإعلان غير موجود"
            );

            return;

        }


        nameInput.value =
        ad.name || "";


        priceInput.value =
        ad.price || "";


        whatsappInput.value =
        ad.whatsapp || "";


        infoInput.value =
        ad.info || "";


        selectedImages = [];


        if (
            Array.isArray(ad.images)
        ) {

            ad.images.forEach(
                function(url) {

                    if (
                        typeof url === "string" &&
                        url.trim() !== ""
                    ) {

                        selectedImages.push(
                            url
                        );

                    }

                }
            );

        }


        showPreview();


        setMessage("");

    } catch(error) {

        console.error(error);


        setMessage(
            "❌ تعذر تحميل الإعلان: " +
            error.message
        );

    }

}


/* =====================================
   رفع الصور
===================================== */

async function uploadImages() {

    const imageUrls = [];


    for (
        let i = 0;
        i < selectedImages.length;
        i++
    ) {

        const item =
        selectedImages[i];


        /* الصورة القديمة */

        if (
            typeof item === "string"
        ) {

            imageUrls.push(
                item
            );

            continue;

        }


        /* صورة جديدة */

        const fileName =
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2, 10) +
        ".jpg";


        const result =
        await supabaseClient
        .storage
        .from("motosyria-images")
        .upload(
            fileName,
            item.blob,
            {
                contentType:
                "image/jpeg",

                upsert:
                false
            }
        );


        if (result.error) {

            throw result.error;

        }


        const publicResult =
        supabaseClient
        .storage
        .from("motosyria-images")
        .getPublicUrl(
            fileName
        );


        if (
            !publicResult.data ||
            !publicResult.data.publicUrl
        ) {

            throw new Error(
                "لم يتم الحصول على رابط الصورة"
            );

        }


        imageUrls.push(
            publicResult.data.publicUrl
        );

    }


    return imageUrls;

}


/* =====================================
   حفظ الإعلان
===================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
        nameInput.value.trim();

        const price =
        priceInput.value.trim();

        const whatsapp =
        whatsappInput.value.trim();

        const info =
        infoInput.value.trim();


        if (
            !name ||
            !price
        ) {

            setMessage(
                "⚠️ اكتب اسم الدراجة والسعر"
            );

            return;

        }


        saveButton.disabled =
        true;


        setMessage(
            "⏳ جاري حفظ الإعلان..."
        );


        try {

            const imageUrls =
            await uploadImages();


            /* =================================
               تعديل
            ================================= */

            if (editId) {

                const result =
                await supabaseClient
                .from("ads")
                .update({

                    name:
                    name,

                    price:
                    price,

                    whatsapp:
                    whatsapp,

                    info:
                    info,

                    images:
                    imageUrls

                })
                .eq(
                    "id",
                    editId
                );


                if (result.error) {

                    throw result.error;

                }


                setMessage(
                    "✅ تم تعديل الإعلان بنجاح"
                );

            }


            /* =================================
               إضافة جديد
            ================================= */

            else {

                const result =
                await supabaseClient
                .from("ads")
                .insert({

                    name:
                    name,

                    price:
                    price,

                    whatsapp:
                    whatsapp,

                    info:
                    info,

                    images:
                    imageUrls

                });


                if (result.error) {

                    throw result.error;

                }


                setMessage(
                    "✅ تم إضافة الإعلان بنجاح"
                );

            }


            setTimeout(
                function() {

                    window.location.href =
                    "index.html";

                },
                700
            );


        } catch(error) {

            console.error(error);


            setMessage(
                "❌ حدث خطأ أثناء الحفظ: " +
                error.message
            );


            saveButton.disabled =
            false;

        }

    }
);


/* =====================================
   تشغيل الصفحة
===================================== */

loadEditAd();

</script>

</body>

</html>
