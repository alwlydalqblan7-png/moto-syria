.main-image {

.no-image {

.thumbnail {

    line-height: 1.9;

    padding: 10px 0;

    font-weight: bold;
}

    display: block;
    text-align: center;

    color: white;

    border-radius: 11px;

    font-weight: bold;
}

.error {
    text-align: center;

}

><div class="loading">

</div></div></main><script>


/* ==============================
   Supabase
============================== */

const SUPABASE_URL =
"https://vfqsaylyokckxobrslvb.supabase.co";


const SUPABASE_KEY =
"sb_publishable_4s_UaWxuR3Hyc0WFfk0yHQ_8oL9rHwg";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   العناصر
============================== */

const container =
document.getElementById(
    "detailsContainer"
);


/* ==============================
   ID الإعلان
============================== */

const params =
new URLSearchParams(
    window.location.search
);


const adId =
params.get("id");


/* ==============================
   الصور
============================== */

function getImages(ad) {

    if (
        Array.isArray(ad.images) &&
        ad.images.length > 0
    ) {

        return ad.images;

    }

    return [];

}


/* ==============================
   حماية النص
============================== */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==============================
   تغيير الصورة
============================== */

function changeImage(src) {

    const mainImage =
    document.getElementById(
        "mainImage"
    );


    if (mainImage) {

        mainImage.src = src;

    }

}


/* ==============================
   عرض الخطأ
============================== */

function showError(text) {

    container.innerHTML = `

        <div class="error">

            <h2>❌ ${escapeHTML(text)}</h2>

            <p>
            ربما تم حذف الإعلان أو أن الرابط غير صحيح.
            </p>

        </div>

    `;

}


/* ==============================
   تحميل التفاصيل من Supabase
============================== */

async function showDetails() {


    if (!adId) {

        showError(
            "الإعلان غير موجود"
        );

        return;

    }


    try {


        const { data: ad, error } =
        await supabaseClient
        .from("ads")
        .select("*")
        .eq("id", adId)
        .single();


        if (error) {

            console.error(error);

            throw error;

        }


        if (!ad) {

            showError(
                "الإعلان غير موجود"
            );

            return;

        }


        const images =
        getImages(ad);


        /* ==============================
           معرض الصور
        ============================== */

        let galleryHTML = "";


        if (images.length > 0) {


            galleryHTML = `

                <img
                    id="mainImage"
                    src="${escapeHTML(images[0])}"
                    class="main-image"
                    alt="صورة الدراجة"
                    onerror="this.style.display='none';"
                >

            `;


            if (images.length > 1) {


                galleryHTML += `

                    <div class="thumbnails">

                `;


                images.forEach(
                    function(image, index) {

                        galleryHTML += `

                            <img
                                src="${escapeHTML(image)}"
                                class="thumbnail"
                                alt="صورة ${index + 1}"
                                onclick="changeImage(this.src)"
                            >

                        `;

                    }
                );


                galleryHTML += `

                    </div>

                `;

            }


        } else {


            galleryHTML = `

                <div class="no-image">
                    🏍️
                </div>

            `;

        }


        /* ==============================
           واتساب
        ============================== */

        const whatsapp =
        String(ad.whatsapp || "")
        .replace(/\D/g, "");


        /* ==============================
           عرض الإعلان
        ============================== */

        container.innerHTML = `

            <div>

                ${galleryHTML}

            </div>


            <div class="details-content">


                <h2 class="details-title">

                    🏍️
                    ${escapeHTML(
                        ad.name || "دراجة"
                    )}

                </h2>


                <div class="price">

                    💰
                    ${escapeHTML(
                        ad.price ||
                        "السعر غير محدد"
                    )}

                </div>


                <div class="info-box">


                    <div class="info-row">

                        📋
                        <strong>
                        تفاصيل الإعلان:
                        </strong>

                        <br>

                        ${escapeHTML(
                            ad.info ||
                            "لا توجد تفاصيل إضافية"
                        )}

                    </div>


                </div>


                ${
                    whatsapp
                    ?
                    `

                    <a
                        href="https://wa.me/${whatsapp}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="whatsapp"
                    >

                        📱 تواصل مع صاحب الإعلان عبر واتساب

                    </a>

                    `
                    :
                    ""
                }


            </div>

        `;


    } catch(error) {


        console.error(
            "Details error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h2>
                    ❌ تعذر تحميل الإعلان
                </h2>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "حدث خطأ غير معروف"
                    )}
                </p>

            </div>

        `;

    }

}


/* ==============================
   تشغيل
============================== */

showDetails();


</script></body></html>
